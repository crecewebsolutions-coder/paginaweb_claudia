<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="tileDirty">
      <feColorMatrix type="matrix" 
        values="0.80 0.00 0.00 0 0
                0.00 0.75 0.00 0 0
                0.00 0.00 0.65 0 0
                0.00 0.00 0.00 1 0"/>
    </filter>
    <linearGradient id="grimeLines" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f140a" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#3d2a19" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1f140a" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <image href="service-tile.jpg" width="800" height="600" preserveAspectRatio="xMidYMid slice" filter="url(#tileDirty)"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#grimeLines)"/>
  <ellipse cx="380" cy="480" rx="200" ry="90" fill="#29190d" fill-opacity="0.4"/>
</svg>
