<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="carSeatClean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="60%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="fabricCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clean dark automotive interior -->
  <rect width="800" height="550" fill="#111827"/>

  <!-- Left Car Seat -->
  <g transform="translate(100, 50)">
    <!-- Headrest -->
    <rect x="75" y="20" width="130" height="90" rx="25" fill="#374151" stroke="#4B5563" stroke-width="2"/>
    <rect x="110" y="105" width="14" height="25" fill="#E2E8F0"/>
    <rect x="155" y="105" width="14" height="25" fill="#E2E8F0"/>

    <!-- Backrest -->
    <path d="M 40,130 Q 20,220 30,320 L 250,320 Q 260,220 240,130 Z" fill="url(#carSeatClean)" stroke="#4B5563" stroke-width="2"/>
    <rect x="70" y="140" width="140" height="170" rx="10" fill="url(#fabricCenter)" stroke="#374151" stroke-width="1.5"/>

    <!-- Clean stitching lines -->
    <line x1="75" y1="180" x2="205" y2="180" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="75" y1="220" x2="205" y2="220" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="75" y1="260" x2="205" y2="260" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Seat Cushion -->
    <polygon points="20,330 260,330 280,440 0,440" fill="url(#carSeatClean)" stroke="#4B5563" stroke-width="2"/>
    <polygon points="50,335 230,335 245,430 35,430" fill="url(#fabricCenter)"/>
    <line x1="45" y1="380" x2="235" y2="380" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
  </g>

  <!-- Right Car Seat -->
  <g transform="translate(420, 50)">
    <!-- Headrest -->
    <rect x="75" y="20" width="130" height="90" rx="25" fill="#374151" stroke="#4B5563" stroke-width="2"/>
    <rect x="110" y="105" width="14" height="25" fill="#E2E8F0"/>
    <rect x="155" y="105" width="14" height="25" fill="#E2E8F0"/>

    <!-- Backrest -->
    <path d="M 40,130 Q 20,220 30,320 L 250,320 Q 260,220 240,130 Z" fill="url(#carSeatClean)" stroke="#4B5563" stroke-width="2"/>
    <rect x="70" y="140" width="140" height="170" rx="10" fill="url(#fabricCenter)" stroke="#374151" stroke-width="1.5"/>

    <line x1="75" y1="180" x2="205" y2="180" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="75" y1="220" x2="205" y2="220" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="75" y1="260" x2="205" y2="260" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Seat Cushion -->
    <polygon points="20,330 260,330 280,440 0,440" fill="url(#carSeatClean)" stroke="#4B5563" stroke-width="2"/>
    <polygon points="50,335 230,335 245,430 35,430" fill="url(#fabricCenter)"/>
    <line x1="45" y1="380" x2="235" y2="380" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
  </g>

  <!-- Sparkles -->
  <g fill="#F59E0B" filter="url(#carGlow)">
    <polygon points="230,390 234,398 242,402 234,406 230,414 226,406 218,402 226,398"/>
    <polygon points="580,390 583,396 589,399 583,402 580,408 577,402 571,399 577,396"/>
  </g>
</svg>
